
name: Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        run: |
          GRADLE_FILE=$(find extracted -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLE_FILE"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/*.apk
          if-no-files-found: error
          
